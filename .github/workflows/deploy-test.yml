name: Deploy Test to Hostinger

on:
  push:
    branches:
      - test
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-test
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: test
      url: https://ulitest.mausalinas.com

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔨 Build project
        run: npm run build

      - name: 🚀 Deploy via FTP to Hostinger (Test Environment)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          # Both accounts use the same Hostinger FTP endpoint. The dedicated
          # test username/password restrict this job to the test document root.
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME_TEST }}
          password: ${{ secrets.FTP_PASSWORD_TEST }}
          local-dir: ./dist/
          server-dir: ./
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            api/*.json
            api/*.lock
